<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки — Conventional Comments</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options">
      <section class="site-settings" aria-label="Профили сайтов">
        <h1>Настройки сайтов</h1>
        <label for="profile-list">Профиль</label>
        <select id="profile-list"></select>
        <p id="profile-warning" class="profile-help"></p>
        <form id="profile-form" class="profile-form">
          <label>Адрес сайта<input id="profile-origin" required placeholder="https://git.company.ru"></label>
          <label>Страницы (один путь на строку)<textarea id="profile-paths" rows="2" required></textarea></label>
          <p class="profile-help">Например, /*/-/merge_requests/*; * означает любую часть пути.</p>
          <label>CSS-селектор редактора<input id="profile-editorSelector" required spellcheck="false"></label>
          <label>Положение панели<select id="profile-placement"><option value="before">Над редактором</option><option value="after">Под редактором</option></select></label>
          <p class="profile-help">Корректные изменения сохраняются автоматически.</p>
          <div class="profile-actions"><button id="profile-reset" type="button">Восстановить</button></div>
        </form>
        <div class="profile-actions"><button id="profile-connect" type="button" disabled>Разрешить доступ к сайту</button></div>
        <p id="profile-access" class="profile-help"></p>
        <p id="profile-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="theme.js"></script>
    <script src="site-profiles.js"></script>
    <script src="profile-settings.js"></script>
  </body>
</html>
