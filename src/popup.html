<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conventional Comments</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <h1>Labels</h1>
          <p class="subtitle">Conventional comments</p>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
          <button id="open-settings" class="icon-button nf-icon" type="button" aria-label="Settings" title="Settings"><span aria-hidden="true">&#xf013;</span></button>
        </div>
      </header>
      <label id="emoji-toggle-row" class="emoji-toggle"><input id="emojis-enabled" type="checkbox" autocomplete="off" checked> Show and insert emoji</label>
      <section id="emoji-view" hidden aria-labelledby="emoji-title">
        <div class="emoji-actions"><button id="emoji-back" type="button">Back</button><button id="emoji-none" type="button">No emoji</button></div>
        <h2 id="emoji-title"></h2>
        <p id="emoji-current"></p>
        <p id="emoji-status" role="status"></p>
        <button id="emoji-retry" type="button" hidden>Retry loading</button>
        <div id="emoji-container"></div>
      </section>
      <form id="label-form" class="label-form">
        <div id="label-list" class="label-list" aria-label="Conventional Comments labels"></div>
        <div class="add-row">
          <input id="new-label" type="text" autocomplete="off" placeholder="New label" aria-label="New label">
          <button class="add-button" type="submit">
            <span class="nf-icon" aria-hidden="true">&#xf067;</span>
            <span>Add</span>
          </button>
        </div>
      </form>
      <p id="labels-status" role="status" aria-live="polite"></p>
      <button id="labels-retry" type="button" hidden>Retry saving</button>
    </main>
    <script src="theme.js"></script>
    <script src="label-settings.js"></script>
    <script src="emoji-picker.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
