<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conventional Comments</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <h1>Labels</h1>
          <p class="subtitle">Conventional comments</p>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему"></button>
          <button id="open-settings" class="icon-button nf-icon" type="button" aria-label="Настройки" title="Настройки"><span aria-hidden="true">&#xf013;</span></button>
        </div>
      </header>
      <form id="label-form" class="label-form">
        <div id="label-list" class="label-list" aria-label="Conventional Comments labels"></div>
        <div class="add-row">
          <input id="new-label" type="text" autocomplete="off" placeholder="new label" aria-label="Новый label">
          <button class="add-button" type="submit">
            <span class="nf-icon" aria-hidden="true">&#xf067;</span>
            <span>Add</span>
          </button>
        </div>
      </form>
      <p id="labels-status" role="status" aria-live="polite"></p>
      <button id="labels-retry" type="button" hidden>Повторить сохранение</button>
    </main>
    <script src="theme.js"></script>
    <script src="label-settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
