<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conventional Comments</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <h1>Labels</h1>
      <form id="label-form" class="label-form">
        <div id="label-list" class="label-list" aria-label="Conventional Comments labels"></div>
        <div class="add-row">
          <input id="new-label" type="text" autocomplete="off" placeholder="new label" aria-label="Новый label">
          <button type="submit">Add</button>
        </div>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
